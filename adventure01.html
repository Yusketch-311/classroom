<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flughafen Abenteuer v2</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0e17;
  --panel: #131720;
  --panel2: #1a2030;
  --panel3: #1f2840;
  --border: rgba(100,130,200,0.18);
  --border-g: rgba(52,210,140,0.28);
  --white: #dde8f8;
  --silver: #8090b0;
  --green: #34d28c;
  --green2: #28b070;
  --yellow: #f0c040;
  --red: #e05060;
  --blue: #5090e0;
  --teal: #30c8c0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 64px;
  gap: 20px;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(80,144,224,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(80,144,224,0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  top: -80px; left: 50%;
  transform: translateX(-50%);
  width: 500px; height: 260px;
  background: radial-gradient(ellipse, rgba(52,210,140,0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ── */
header {
  position: relative; z-index: 2;
  text-align: center;
  width: 100%; max-width: 640px;
}

.header-tag {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--green);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

header h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(22px, 4.5vw, 34px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  background: linear-gradient(130deg, var(--white) 30%, var(--teal) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}

header p {
  font-size: 13px;
  color: var(--silver);
  font-weight: 300;
  margin-bottom: 12px;
}

.how-to-box {
  display: inline-flex;
  align-items: center;
  gap: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  font-size: 12px;
}

.how-step {
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--silver);
  font-weight: 300;
}

.how-step .n {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  background: rgba(52,210,140,0.12);
  color: var(--green);
  width: 18px; height: 18px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.how-step + .how-step {
  border-left: 1px solid var(--border);
}

/* ── STATUS BAR ── */
.status-bar {
  position: relative; z-index: 2;
  width: 100%; max-width: 640px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px; color: var(--silver);
  letter-spacing: 0.12em; text-transform: uppercase;
}
.stat-val {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 17px; color: var(--white);
}
.stat-val.g { color: var(--green); }
.stat-val.y { color: var(--yellow); }

.progress-wrap { flex: 1; min-width: 100px; }
.progress-bg {
  height: 5px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--green);
  transition: width 0.5s ease;
}

/* ── TURN DOTS ── */
.turn-dots {
  position: relative; z-index: 2;
  width: 100%; max-width: 640px;
  display: flex; gap: 6px; align-items: center;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  transition: background 0.3s;
}
.dot.done { background: var(--green); }
.dot.cur  { background: var(--yellow); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.dot-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--silver);
  margin-left: 6px; letter-spacing: 0.08em;
}

/* ── SCENE CARD ── */
.scene-wrap {
  position: relative; z-index: 2;
  width: 100%; max-width: 640px;
}

.scene-loc {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--teal);
  letter-spacing: 0.1em;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 10px;
}
.scene-loc::before {
  content: '';
  display: block; width: 20px; height: 1px;
  background: var(--teal);
}

.scene-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

/* NPC says */
.npc-block {
  padding: 22px 26px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 14px; align-items: flex-start;
}

.npc-av {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--panel2);
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; flex-shrink: 0;
}

.npc-body { flex: 1; }
.npc-name {
  font-family: 'DM Mono', monospace;
  font-size: 9px; color: var(--silver);
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 6px;
}
.npc-de {
  font-size: 15px; line-height: 1.65;
  color: var(--white); margin-bottom: 4px;
}
.npc-jp {
  font-size: 12px; color: var(--silver);
  font-style: italic; font-weight: 300;
}

/* YOUR TURN block */
.your-turn {
  padding: 22px 26px;
}

.your-label {
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--teal); margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.your-label::after {
  content: ''; flex: 1;
  height: 1px; background: var(--border);
}

/* task card */
.task-card {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 18px 20px;
  margin-bottom: 16px;
}

.task-situation {
  font-size: 12px; color: var(--silver);
  font-weight: 300; margin-bottom: 8px;
  letter-spacing: 0.02em;
}

.task-main {
  font-size: 17px;
  line-height: 1.6;
  color: var(--white);
  font-weight: 500;
  margin-bottom: 10px;
}

.task-nuance {
  display: flex; gap: 6px; flex-wrap: wrap;
}

.nuance-chip {
  background: rgba(80,144,224,0.1);
  border: 1px solid rgba(80,144,224,0.25);
  border-radius: 20px;
  padding: 3px 11px;
  font-size: 11px; color: var(--blue);
  font-weight: 500;
}

/* Think prompt */
.think-prompt {
  font-size: 13px;
  color: var(--silver);
  font-weight: 300;
  font-style: italic;
  margin-bottom: 16px;
  padding-left: 2px;
  line-height: 1.55;
}

/* reveal button */
.btn-reveal {
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 1.5px dashed rgba(52,210,140,0.35);
  border-radius: 6px;
  padding: 12px 20px;
  width: 100%;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--green);
  letter-spacing: 0.04em;
  transition: all 0.15s ease;
  margin-bottom: 0;
}
.btn-reveal:hover {
  background: rgba(52,210,140,0.06);
  border-color: rgba(52,210,140,0.6);
}
.btn-reveal .arr { transition: transform 0.2s; }
.btn-reveal.open .arr { transform: rotate(90deg); }

/* answer block */
.answer-block {
  display: none;
  margin-top: 14px;
  animation: slideDown 0.28s ease;
}
.answer-block.visible { display: block; }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.answer-inner {
  background: var(--panel3);
  border: 1px solid var(--border-g);
  border-radius: 6px;
  overflow: hidden;
}

.answer-header {
  background: rgba(52,210,140,0.08);
  padding: 10px 18px;
  display: flex; align-items: center; gap: 8px;
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--green);
  letter-spacing: 0.12em; text-transform: uppercase;
  border-bottom: 1px solid var(--border-g);
}

.answers-list {
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 14px;
}

.answer-item {}
.ans-de {
  font-size: 15px; line-height: 1.6;
  color: var(--white); margin-bottom: 4px;
}
.ans-jp {
  font-size: 12px; color: var(--silver);
  font-style: italic; font-weight: 300;
  margin-bottom: 6px;
}
.ans-style {
  display: inline-block;
  background: rgba(80,144,224,0.1);
  border: 1px solid rgba(80,144,224,0.2);
  border-radius: 3px;
  padding: 2px 9px;
  font-size: 10px; color: var(--blue);
  font-weight: 500; letter-spacing: 0.06em;
}

.answer-item + .answer-item {
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

/* grammar tip */
.grammar-tip {
  padding: 12px 18px;
  border-top: 1px solid var(--border-g);
  background: rgba(240,192,64,0.04);
  display: flex; gap: 10px;
  align-items: flex-start;
}

.tip-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.tip-body {}
.tip-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px; color: var(--yellow);
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 4px;
}
.tip-text {
  font-size: 12px; color: var(--silver);
  line-height: 1.6; font-weight: 300;
}
.tip-text strong { color: var(--white); font-weight: 500; }

/* next button */
.btn-next-wrap {
  padding: 16px 26px;
  border-top: 1px solid var(--border);
  display: none;
}
.btn-next-wrap.visible { display: block; }

.btn-next {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 12px;
  letter-spacing: 0.1em; text-transform: uppercase;
  background: var(--green); color: #0a1a10;
  border: none; border-radius: 4px;
  padding: 11px 24px; cursor: pointer;
  transition: all 0.12s ease;
}
.btn-next:hover { background: var(--green2); transform: translateY(-1px); }

/* END SCREEN */
.end-screen {
  position: relative; z-index: 2;
  width: 100%; max-width: 640px;
}

.end-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 40px 32px;
  text-align: center;
}

.end-stamp { font-size: 52px; margin-bottom: 14px; }
.end-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 22px;
  text-transform: uppercase;
  letter-spacing: 0.04em; margin-bottom: 8px;
}
.end-sub {
  font-size: 14px; color: var(--silver);
  line-height: 1.7; margin-bottom: 24px;
}

.end-phrases {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 18px;
  margin-bottom: 24px;
  text-align: left;
}

.end-phrases h3 {
  font-family: 'Syne', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--green); margin-bottom: 12px;
}

.phrase-row {
  display: flex; justify-content: space-between;
  align-items: baseline;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.phrase-row:last-child { border-bottom: none; }
.pr-de { font-size: 13px; color: var(--white); }
.pr-jp { font-size: 11px; color: var(--silver); font-style: italic; text-align: right; }

.btn-restart {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 13px;
  letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--green); color: #0a1a10;
  border: none; border-radius: 4px;
  padding: 14px 32px; cursor: pointer;
  transition: all 0.12s ease;
}
.btn-restart:hover { background: var(--green2); }

.hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="header-tag">🎙 スピーキング練習 · Sprechübung</div>
  <h1>Flughafen Abenteuer v2</h1>
  <p>日本語の状況を読んで、ドイツ語で声に出してみましょう</p>
  <div class="how-to-box">
    <div class="how-step"><span class="n">1</span>状況を読む</div>
    <div class="how-step"><span class="n">2</span>ドイツ語で声に出す</div>
    <div class="how-step"><span class="n">3</span>模範解答と比べる</div>
  </div>
</header>

<div class="status-bar" id="statusBar">
  <div class="stat">
    <div class="stat-label">シーン</div>
    <div class="stat-val" id="statScene">1 / 7</div>
  </div>
  <div class="stat progress-wrap">
    <div class="stat-label">進捗</div>
    <div class="progress-bg"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div class="stat">
    <div class="stat-label">場所</div>
    <div class="stat-val g" id="statLoc">—</div>
  </div>
</div>

<div class="turn-dots" id="turnDots"></div>

<div class="scene-wrap" id="sceneWrap">
  <div class="scene-loc" id="sceneLoc"></div>
  <div class="scene-card" id="sceneCard"></div>
</div>

<div class="end-screen hidden" id="endScreen"></div>

<script>
const scenes = [
  {
    loc: "🏢 Check-in Schalter",
    locLabel: "チェックイン",
    npc: { emoji: "🧑‍✈️", name: "Mitarbeiterin am Schalter",
      de: "Guten Tag! Darf ich Ihren Reisepass und Ihre Buchungsbestätigung sehen?",
      jp: "こんにちは！パスポートと予約確認書を拝見できますか？" },
    task: {
      situation: "あなたはチェックインカウンターに並び、係員が声をかけてきました。",
      main: "パスポートを差し出しながら、スーツケースを1個預けたいこと・窓側の席を希望することを伝えましょう。",
      nuance: ["丁寧に", "簡潔に"],
      think: "まず持ち物を渡してから、2つのお願いを順番に伝えてみましょう。Ich möchte ～ / Kann ich ～? などを活用して。"
    },
    answers: [
      { de: "Ja, natürlich. Hier bitte. — Ich möchte auch diesen Koffer aufgeben. Und kann ich einen Fensterplatz bekommen?", jp: "はい、どうぞ。このスーツケースも預けたいのですが。窓側の席をもらえますか？", style: "丁寧・標準" },
      { de: "Bitte sehr. Ich habe einen Koffer zum Aufgeben. Außerdem hätte ich gerne einen Fensterplatz.", jp: "どうぞ。スーツケースを1個預けます。それから窓側の席が希望です。", style: "やや丁寧・上級" },
    ],
    tip: { label: "文法ポイント", text: "<strong>Ich möchte</strong>（〜したい）は基本。<strong>Ich hätte gerne</strong>（〜できれば嬉しいのですが）を使うとより丁寧な印象に。" }
  },
  {
    loc: "🏢 Check-in Schalter",
    locLabel: "重量オーバー",
    npc: { emoji: "🧑‍✈️", name: "Mitarbeiterin am Schalter",
      de: "Ihr Koffer wiegt 26 Kilogramm. Das Limit ist 23 Kilo. Sie müssen 3 Kilo herausnehmen oder eine Übergewichtsgebühr bezahlen.",
      jp: "お荷物は26キロです。上限は23キロです。3キロ取り出すか、超過料金をお支払いください。" },
    task: {
      situation: "スーツケースが重量オーバーしていると言われました。追加料金を払うことにしました。",
      main: "超過料金はいくらか聞いて、クレジットカードで払えるかも確認しましょう。",
      nuance: ["落ち着いて", "具体的に"],
      think: "Wie viel kostet ～? / Kann ich mit Kreditkarte ～? などを使ってみましょう。"
    },
    answers: [
      { de: "Wie viel kostet die Übergewichtsgebühr? Und kann ich mit Kreditkarte bezahlen?", jp: "超過料金はいくらですか？クレジットカードで払えますか？", style: "直接的・明確" },
      { de: "Was kostet das genau? Ich würde gerne mit Karte zahlen, wenn das möglich ist.", jp: "正確にいくらですか？可能であればカードで払いたいのですが。", style: "やや柔らかい表現" },
    ],
    tip: { label: "文法ポイント", text: "<strong>Was kostet ～?</strong> と <strong>Wie viel kostet ～?</strong> はどちらも「いくらですか？」。<strong>wenn das möglich ist</strong>（もし可能であれば）を添えると柔らかく丁寧な印象になります。" }
  },
  {
    loc: "🔍 Sicherheitskontrolle",
    locLabel: "手荷物検査",
    npc: { emoji: "👮", name: "Sicherheitsbeamter",
      de: "Stopp. Ihr Handgepäck muss nochmals überprüft werden. Bitte warten Sie hier.",
      jp: "止まってください。手荷物を再度検査します。ここでお待ちください。" },
    task: {
      situation: "手荷物が引っかかり、再検査になりました。乗継便があるので時間が心配です。",
      main: "何が問題なのか聞いて、乗り継ぎ時間がタイトだと伝えましょう。",
      nuance: ["冷静に", "状況説明を添えて"],
      think: "Was ist das Problem? / Ich habe einen Anschlussflug ... などを組み合わせてみましょう。"
    },
    answers: [
      { de: "Was ist das Problem? Ich habe einen Anschlussflug und nur wenig Zeit.", jp: "何が問題ですか？乗継便があって時間があまりないのですが。", style: "直接・簡潔" },
      { de: "Darf ich fragen, was genau nicht in Ordnung ist? Ich mache mir Sorgen, meinen Anschlussflug zu verpassen.", jp: "何が問題なのか聞いてもいいですか？乗り継ぎに乗り遅れそうで心配なのですが。", style: "丁寧・詳細" },
    ],
    tip: { label: "文法ポイント", text: "<strong>Ich mache mir Sorgen, ～ zu</strong> は「〜することが心配です」。<strong>verpassen</strong>（乗り遅れる）は旅行でよく使う動詞です。" }
  },
  {
    loc: "🚪 Gate C14",
    locLabel: "ゲート変更",
    npc: { emoji: "📢", name: "Durchsage（アナウンス）",
      de: "Achtung Passagiere: Flug LH714 nach München. Das Gate hat sich geändert. Bitte begeben Sie sich zu Gate C14.",
      jp: "旅客の皆様にお知らせします。ミュンヘン行きLH714便のゲートが変更になりました。C14ゲートにお越しください。" },
    task: {
      situation: "アナウンスを聞きましたが、C14がどこか分かりません。近くにいた係員に聞きます。",
      main: "C14ゲートはどこか、そしてそこまで歩いてどのくらいかかるか聞きましょう。",
      nuance: ["すみませんと声をかけてから", "2つの質問を続けて"],
      think: "Wo ist Gate C14? / Wie lange dauert es zu Fuß? など。"
    },
    answers: [
      { de: "Entschuldigung, wo finde ich Gate C14? Und wie lange dauert es zu Fuß?", jp: "すみません、C14ゲートはどこですか？歩いてどのくらいかかりますか？", style: "自然・標準" },
      { de: "Entschuldigen Sie bitte — ich suche Gate C14. Ist es weit von hier?", jp: "すみません、C14ゲートを探しているのですが。ここから遠いですか？", style: "シンプル・通じやすい" },
    ],
    tip: { label: "文法ポイント", text: "<strong>Wo finde ich ～?</strong>（〜はどこで見つかりますか？）は「〜はどこですか？」よりやや自然な口語表現。<strong>Wie lange dauert es ～?</strong>（〜にはどのくらいかかりますか？）も重要フレーズです。" }
  },
  {
    loc: "✈️ An Bord",
    locLabel: "機内トラブル",
    npc: { emoji: "🧑‍✈️", name: "Flugbegleiterin",
      de: "Kann ich Ihnen helfen?",

      { de: "Der Platz neben mir ist sehr zurückgelehnt. Gibt es vielleicht einen anderen freien Platz für mich?", jp: "隣の席がとても倒れています。他に空いている席はありますか？", style: "代替案を提示" },

    },

    ],

];

let current = 0;
let revealed = false;

function renderDots() {
  document.getElementById('turnDots').innerHTML =
    scenes.map((_, i) => {
      let cls = 'dot';
      if (i < current) cls += ' done';
      else if (i === current) cls += ' cur';
      return `<div class="${cls}"></div>`;
    }).join('') +
    `<span class="dot-label">シーン ${current + 1} / ${scenes.length}</span>`;
}

function renderScene() {
  revealed = false;
  const s = scenes[current];

  document.getElementById('statScene').textContent = `${current + 1} / ${scenes.length}`;
  document.getElementById('statLoc').textContent = s.locLabel;
  document.getElementById('progFill').style.width = (current / scenes.length * 100) + '%';
  document.getElementById('sceneLoc').textContent = s.loc;

  renderDots();

  const nuanceHtml = s.task.nuance.map(n => `<span class="nuance-chip">${n}</span>`).join('');

  const answersHtml = s.answers.map(a => `
    <div class="answer-item">
      <div class="ans-de">${a.de}</div>
      <div class="ans-jp">${a.jp}</div>
      <span class="ans-style">${a.style}</span>
    </div>
  `).join('');

  document.getElementById('sceneCard').innerHTML = `
    <div class="npc-block">
      <div class="npc-av">${s.npc.emoji}</div>
      <div class="npc-body">
        <div class="npc-name">${s.npc.name}</div>
        <div class="npc-de">${s.npc.de}</div>
        <div class="npc-jp">${s.npc.jp}</div>
      </div>
    </div>

    <div class="your-turn">
      <div class="your-label">あなたの番 · Ihr Turn</div>

      <div class="task-card">
        <div class="task-situation">${s.task.situation}</div>
        <div class="task-main">${s.task.main}</div>
        <div class="task-nuance">${nuanceHtml}</div>
      </div>

      <div class="think-prompt">💭 ${s.task.think}</div>

      <button class="btn-reveal" id="revealBtn" onclick="toggleReveal()">
        <span class="arr">▶</span> 声に出したら模範解答を確認する
      </button>

      <div class="answer-block" id="answerBlock">
        <div class="answer-inner">
          <div class="answer-header">✦ 模範解答 Musterlösung</div>
          <div class="answers-list">${answersHtml}</div>
          <div class="grammar-tip">
            <div class="tip-icon">💡</div>
            <div class="tip-body">
              <div class="tip-label">${s.tip.label}</div>
              <div class="tip-text">${s.tip.text}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="btn-next-wrap" id="nextWrap">
      ${current < scenes.length - 1
        ? `<button class="btn-next" onclick="nextScene()">次のシーンへ →</button>`
        : `<button class="btn-next" onclick="showEnd()">結果・まとめを見る 🏁</button>`
      }
    </div>
  `;
}

function toggleReveal() {
  const block = document.getElementById('answerBlock');
  const btn   = document.getElementById('revealBtn');
  const nextW = document.getElementById('nextWrap');

  revealed = !revealed;
  block.classList.toggle('visible', revealed);
  btn.classList.toggle('open', revealed);
  btn.innerHTML = revealed
    ? `<span class="arr">▶</span> 閉じる`
    : `<span class="arr">▶</span> 声に出したら模範解答を確認する`;

  if (revealed) {
    nextW.classList.add('visible');
    setTimeout(() => block.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
  } else {
    nextW.classList.remove('visible');
  }
}

function nextScene() {
  current++;
  renderScene();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showEnd() {
  document.getElementById('sceneWrap').classList.add('hidden');
  document.getElementById('turnDots').classList.add('hidden');

  // Collect all key phrases
  const allPhrases = [
    { de: "Ich hätte gerne einen Fensterplatz.", jp: "窓側の席が希望です。" },
    { de: "Was kostet die Übergewichtsgebühr?", jp: "超過料金はいくらですか？" },
    { de: "Ich mache mir Sorgen, meinen Anschlussflug zu verpassen.", jp: "乗り継ぎを逃しそうで心配です。" },
    { de: "Wie lange dauert es zu Fuß?", jp: "歩いてどのくらいかかりますか？" },
    { de: "Könnten Sie ～ bitten, ...?", jp: "〜にお願いしてもらえますか？" },
    { de: "Ich habe alle Unterlagen dabei.", jp: "必要な書類はすべて持っています。" },
    { de: "Es ist dringend, weil ～", jp: "〜なので急いでいます。" },
  ];

  const phrasesHtml = allPhrases.map(p => `
    <div class="phrase-row">
      <span class="pr-de">${p.de}</span>
      <span class="pr-jp">${p.jp}</span>
    </div>
  `).join('');

  document.getElementById('endScreen').classList.remove('hidden');
  document.getElementById('endScreen').innerHTML = `
    <div class="end-card">
      <div class="end-stamp">🏅</div>
      <div class="end-title">Gut gemacht!</div>
      <div class="end-sub">
        全${scenes.length}シーンを完走しました！<br>
        チェックインから入国審査・荷物紛失まで、実際の留学渡航で出会う場面を練習しました。<br>
        気になったフレーズをもう一度声に出して確認しましょう。
      </div>
      <div class="end-phrases">
        <h3>📌 今日のキーフレーズまとめ</h3>
        ${phrasesHtml}
      </div>
      <button class="btn-restart" onclick="restart()">🔄 もう一度挑戦する</button>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  current = 0;
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('sceneWrap').classList.remove('hidden');
  document.getElementById('turnDots').classList.remove('hidden');
  document.getElementById('progFill').style.width = '0%';
  renderScene();
}

renderScene();
</script>
</body>
</html>
