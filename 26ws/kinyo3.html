  </header>

  </div>

  <section id="cards" class="view">
    <div class="filters" id="filters"></div>
    <div id="cats"></div>
    <div class="extra">

    </div>
  </section>

  </section>

    <ol class="qlist" id="qlist"></ol>
  </section>

</div>

];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const color = id => `var(--c-${id})`;
const byId = Object.fromEntries(T.map(t => [t[0], t]));
const catOf = id => CATS.find(c => c.id === id);

// 配列案から各テーマの回を求める
const weekOf = {};
PLAN.forEach(s => s.weeks.forEach((w, i) => w.forEach(id => { if (byId[id]) weekOf[id] = `${s.name[0]}${i + 1}`; })));

function renderCards(active) {
  document.getElementById("cats").innerHTML = CATS.filter(c => !active || c.id === active).map(c => {
    const rank = id => { const w = weekOf[id]; return w ? (w[0]==="前"?0:100) + parseInt(w.slice(1)) : 999; };
    const cards = T.filter(t => t[1] === c.id).sort((a,b) => rank(a[0]) - rank(b[0])).map(t => `
      <article class="card" style="--c:${color(c.id)}">
        ${weekOf[t[0]] ? `<span class="week">${weekOf[t[0]].replace("前","前期 第").replace("後","後期 第")}回</span>` : ""}
        <h3>${esc(t[2])}</h3>
        <div class="de">${esc(t[3])}</div>
        ${t[4] ? `<div class="jp"><b>日本では</b>${esc(t[4])}</div>` : ""}
        <details><summary>答えの例</summary><p>${esc(t[6])}</p></details>
        <div class="kw">${t[7].map(k => `<span>${esc(k)}</span>`).join("")}</div>
      </article>`).join("");
    return `<section class="cat" style="--c:${color(c.id)}">
      <div class="cat-head"><h2>${c.jp}</h2><span class="de">${c.de}</span></div>
      <div class="grid">${cards}</div></section>`;
  }).join("");
}

function renderFilters() {
  const f = document.getElementById("filters");
  f.innerHTML = `<button class="chip" aria-pressed="true" data-cat="">すべて <span class="n">${T.length}</span></button>` +
    CATS.map(c => `<button class="chip" aria-pressed="false" data-cat="${c.id}" style="--c:${color(c.id)}"><span class="dot"></span>${c.jp} <span class="n">${T.filter(t => t[1] === c.id).length}</span></button>`).join("");
  f.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    f.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderCards(b.dataset.cat);
  });
}

function renderPlan() {

    <div class="sem">
      <h2>${s.name}：${s.title}</h2>
      <p class="sub">${s.sub}</p>
      <div class="timeline">${s.weeks.map((w, i) => {
        if (!byId[w[0]]) return `<div class="step" data-w="${i + 1}"><div class="cat-label" style="color:var(--swiss)">まとめ</div><h3>学生発表とまとめ</h3></div>`;
        const t = byId[w[0]], c = catOf(t[1]);
        const title = w.map(id => esc(byId[id][2])).join(" ＋ ");
        const de = w.map(id => esc(byId[id][3])).join(" / ");
        return `<div class="step" data-w="${i + 1}" style="--c:${color(c.id)}">
          <div class="cat-label">${c.jp}${w.length > 1 ? "　<span class=\"pair\">2テーマを1回で</span>" : ""}</div>
          <h3>${title}</h3><div class="de" style="color:var(--muted);font-size:13px">${de}</div></div>`;
      }).join("")}</div>
    </div>`).join("");
}

function renderQs() {
  document.getElementById("qlist").innerHTML = T.map(t =>
    `<li style="--c:${color(t[1])}"><div class="t">${esc(t[2])}</div>${esc(t[5])}</li>`).join("");
}

document.getElementById("extra").innerHTML = EXTRA.map(e => `<span>${esc(e)}</span>`).join("");

document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === tab));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("hidden", v.id !== tab.dataset.view));
}));

renderFilters();
renderCards("");
renderPlan();
renderQs();
</script>
</body>
</html>
