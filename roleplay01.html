<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flughafen Rollenspiel v2</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sky: #0a1628;
  --sky2: #0f2040;
  --panel: #111d33;
  --panel2: #162240;
  --gold: #f0c040;
  --gold2: #f5d478;
  --silver: #a8b8d0;
  --white: #e8eef8;
  --green: #34c98a;
  --red: #e05a6a;
  --border: rgba(168,184,208,0.15);
  --border2: rgba(240,192,64,0.3);
  --keyword-bg: rgba(240,192,64,0.12);
  --keyword-border: rgba(240,192,64,0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--sky);
  color: var(--white);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px 56px;
  gap: 0;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 38% 72%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 63% 12%, rgba(255,255,255,0.45) 0%, transparent 100%),
    radial-gradient(1px 1px at 82% 52%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 91% 83%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 6% 88%, rgba(255,255,255,0.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 52% 47%, rgba(255,255,255,0.25) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ── */
header {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-bottom: 28px;
  width: 100%;
  max-width: 720px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 5px;
}

.plane-icon {
  font-size: 22px;
  animation: hover-plane 3s ease-in-out infinite;
}
@keyframes hover-plane {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-4px) rotate(2deg); }
}

header h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(18px, 3.5vw, 26px);
  letter-spacing: 0.05em;
  color: var(--gold);
  text-transform: uppercase;
}

.ver-badge {
  display: inline-block;
  background: var(--gold);
  color: var(--sky);
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 9px;
  letter-spacing: 0.1em;
  padding: 2px 7px;
  border-radius: 2px;
  vertical-align: middle;
  margin-left: 6px;
  position: relative;
  top: -2px;
}

header p {
  font-size: 12px;
  color: var(--silver);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 300;
  margin-bottom: 10px;
}

/* HOW TO USE */
.how-to {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 8px 18px;
  font-size: 12px;
  color: var(--gold2);
  font-weight: 300;
  letter-spacing: 0.04em;
}

.how-to .sep { color: var(--border); }

/* ── SCENARIO TABS ── */
.scenario-nav {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 720px;
  margin-bottom: 22px;
}

.scenario-nav h2 {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--silver);
  margin-bottom: 10px;
}

.scenario-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.tab {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--silver);
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.tab:hover { border-color: var(--gold); color: var(--gold); }
.tab.active { background: var(--gold); border-color: var(--gold); color: var(--sky); font-weight: 700; }

/* ── CARD ── */
.card-area {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 720px;
  margin-bottom: 20px;
}

.mission-box {
  background: var(--panel2);
  border: 1px solid var(--border2);
  border-radius: 6px 6px 0 0;
  padding: 16px 24px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.mission-label {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  white-space: nowrap;
  margin-top: 1px;
}

.mission-text {
  font-size: 13px;
  line-height: 1.65;
  color: var(--white);
}
.mission-text strong { color: var(--gold2); }

/* role header */
.dialogue-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 6px 6px;
  overflow: hidden;
}

.card-header {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid var(--border);
}

.role-header {
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.role-header:first-child { border-right: 1px solid var(--border); }

.role-emoji { font-size: 18px; }
.role-name {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold);
}
.role-sub {
  font-size: 11px;
  color: var(--silver);
  font-weight: 300;
  margin-top: 1px;
}

/* ── TURN ROW ── */
.turn {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid var(--border);
}
.turn:last-child { border-bottom: none; }

.turn-cell {
  padding: 18px 20px 16px 28px;
  position: relative;
}
.turn-cell:first-child { border-right: 1px solid var(--border); }

.turn-num {
  position: absolute;
  top: 10px;
  left: 9px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: rgba(168,184,208,0.3);
}

/* STAFF cell — always fully visible */
.staff-de {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--white);
}
.staff-jp {
  font-size: 11px;
  color: var(--silver);
  margin-top: 4px;
  font-weight: 300;
  font-style: italic;
}

/* PASSENGER cell — keyword hint + reveal */
.pass-task {
  font-size: 11.5px;
  color: var(--silver);
  font-style: italic;
  margin-bottom: 10px;
  font-weight: 300;
  line-height: 1.5;
}

/* keyword chips */
.keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.kw {
  background: var(--keyword-bg);
  border: 1px solid var(--keyword-border);
  border-radius: 3px;
  padding: 3px 9px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--gold2);
  letter-spacing: 0.04em;
}

/* reveal button */
.reveal-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1px dashed rgba(168,184,208,0.3);
  border-radius: 3px;
  padding: 5px 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: var(--silver);
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.15s ease;
  margin-top: 2px;
}
.reveal-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}
.reveal-btn .icon { font-size: 13px; transition: transform 0.2s ease; }
.reveal-btn.open .icon { transform: rotate(90deg); }

/* full sentence (hidden by default) */
.full-sentence {
  display: none;
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(240,192,64,0.06);
  border-left: 2px solid var(--gold);
  border-radius: 0 3px 3px 0;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.full-sentence.visible { display: block; }

.full-de {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--white);
}
.full-jp {
  font-size: 11px;
  color: var(--silver);
  margin-top: 4px;
  font-style: italic;
  font-weight: 300;
}
.full-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--gold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
  opacity: 0.7;
}

/* empty cell */
.turn-blank {
  color: rgba(168,184,208,0.2);
  font-size: 13px;
  padding-top: 2px;
}

/* ── KEY PHRASES ── */
.phrases-area {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 720px;
  margin-bottom: 24px;
}
.phrases-area h2 {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--silver);
  margin-bottom: 10px;
}
.phrases-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 7px;
}
.phrase-chip {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 14px;
  position: relative;
  overflow: hidden;
}
.phrase-chip::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--gold);
}
.phrase-de {
  font-size: 13px;
  color: var(--white);
  margin-bottom: 3px;
  font-weight: 500;
}
.phrase-jp {
  font-size: 11px;
  color: var(--silver);
  font-weight: 300;
}

/* ── CONTROLS ── */
.controls {
  position: relative;
  z-index: 2;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 20px;
}

button.btn-gold, button.btn-outline {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  padding: 11px 22px;
  transition: all 0.12s ease;
}
.btn-gold { background: var(--gold); color: var(--sky); }
.btn-gold:hover { background: var(--gold2); transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--silver); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--silver); color: var(--white); }

/* reveal-all button */
.btn-reveal-all {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: transparent;
  color: var(--green);
  border: 1px solid rgba(52,201,138,0.4);
  border-radius: 3px;
  cursor: pointer;
  padding: 11px 22px;
  transition: all 0.12s ease;
}
.btn-reveal-all:hover { background: rgba(52,201,138,0.1); }

.card-area.switching .dialogue-card {
  animation: fadeSwitch 0.3s ease forwards;
}
@keyframes fadeSwitch {
  0%   { opacity: 1; transform: translateY(0); }
  40%  { opacity: 0; transform: translateY(-8px); }
  60%  { opacity: 0; transform: translateY(8px); }
  100% { opacity: 1; transform: translateY(0); }
}

footer {
  position: relative;
  z-index: 2;
  font-size: 11px;
  color: rgba(168,184,208,0.3);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  text-align: center;
}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <span class="plane-icon">✈</span>
    <h1>Flughafen Rollenspiel <span class="ver-badge">V2</span></h1>
  </div>
  <p>ペア練習用 · Deutsch am Flughafen</p>
  <div class="how-to">
    🧑‍✈️ 担当者役：全文をそのまま読む
    <span class="sep">｜</span>
    🧳 乗客役：キーワードを見て自分で考え → クリックで正解確認
  </div>
</header>

<div class="scenario-nav">
  <h2>シナリオを選ぶ</h2>
  <div class="scenario-tabs" id="scenarioTabs"></div>
</div>

<div class="card-area" id="cardArea">
  <div class="mission-box" id="missionBox"></div>
  <div class="dialogue-card">
    <div class="card-header" id="cardHeader"></div>
    <div class="dialogue-body" id="dialogueBody"></div>
  </div>
</div>

<div class="phrases-area">
  <h2>🔑 このシナリオのキーフレーズ</h2>
  <div class="phrases-grid" id="phrasesGrid"></div>
</div>

<div class="controls">
  <button class="btn-outline" onclick="shuffleRoles()">↔ 役を入れ替える</button>
  <button class="btn-reveal-all" onclick="revealAll()">✦ 全文を表示</button>
  <button class="btn-gold" onclick="nextScenario()">次のシナリオへ →</button>
</div>

<footer>キーワードだけ見て声に出して考えてみましょう · Denken Sie auf Deutsch!</footer>

<script>
const scenarios = [
  {
    id: "checkin",
    tab: "① チェックイン",
    location: "🏢 Check-in Schalter · チェックインカウンター",
    mission: `フライト <strong>LH714 Frankfurt → München</strong> のチェックイン。スーツケースを1個預けて、<strong>窓側の席</strong>をリクエストしましょう。搭乗時刻も確認を！`,
    roles: [
      { emoji: "🧑‍✈️", name: "Mitarbeiter/in", sub: "担当者役 ─ 全文読む" },
      { emoji: "🧳", name: "Passagier/in",   sub: "乗客役 ─ キーワードを見て考える" }
    ],
    dialogue: [
      {
        staff: { de: "Guten Tag! Darf ich Ihren Reisepass und Ihre Buchungsbestätigung sehen?", jp: "こんにちは！パスポートと予約確認書を拝見できますか？" },
        pass:  { task: "はい、どうぞ、と差し出す", keywords: ["natürlich", "Hier bitte"], de: "Ja, natürlich. Hier bitte.", jp: "はい、もちろんです。どうぞ。" }
      },
      {
        staff: { de: "Danke. Möchten Sie Ihr Gepäck aufgeben?", jp: "ありがとうございます。お荷物を預けますか？" },
        pass:  { task: "このスーツケースを預けたい。重さの上限を聞く", keywords: ["Koffer", "aufgeben", "Wie viel ... wiegen?"], de: "Ja, diesen Koffer bitte. Wie viel darf er wiegen?", jp: "はい、このスーツケースをお願いします。何キロまでですか？" }
      },
      {
        staff: { de: "Bis zu 23 Kilogramm. Ihr Koffer wiegt 21,5 Kilo — alles in Ordnung.", jp: "23キロまでです。21.5キロで問題ありません。" },
        pass:  { task: "窓側の席をリクエストする", keywords: ["Fensterplatz", "bekommen?"], de: "Gut. Kann ich einen Fensterplatz bekommen?", jp: "よかった。窓側の席をもらえますか？" }
      },
      {
        staff: { de: "Natürlich! Platz 22A ist frei — ein schöner Fensterplatz.", jp: "もちろん！22A席が空いています。良い窓側の席ですよ。" },
        pass:  { task: "搭乗は何時から？と聞く", keywords: ["Boarding", "Um wie viel Uhr?"], de: "Perfekt, danke! Um wie viel Uhr beginnt das Boarding?", jp: "完璧、ありがとう！搭乗は何時から始まりますか？" }
      },
      {
        staff: { de: "Das Boarding beginnt um 14:30 Uhr an Gate B7. Guten Flug!", jp: "搭乗はB7ゲートで14:30から。良いフライトを！" },
        pass:  { task: "お礼を言ってお別れする", keywords: ["Danke schön", "Auf Wiedersehen"], de: "Danke schön! Auf Wiedersehen.", jp: "ありがとうございます！さようなら。" }
      }
    ],
    phrases: [
      { de: "Darf ich ... sehen?", jp: "〜を拝見できますか？" },
      { de: "Ich möchte ... aufgeben.", jp: "〜を預けたいのですが。" },
      { de: "Wie viel darf er wiegen?", jp: "何キロまで許可されますか？" },
      { de: "Kann ich einen Fensterplatz bekommen?", jp: "窓側の席をもらえますか？" },
      { de: "Um wie viel Uhr beginnt das Boarding?", jp: "搭乗は何時に始まりますか？" },
      { de: "Guten Flug!", jp: "良いフライトを！" },
    ]
  },
  {
    id: "security",
    tab: "② 手荷物検査",
    location: "🔍 Sicherheitskontrolle · 手荷物検査場",
    mission: `手荷物検査を通過します。金属類・ベルト・ノートPC・液体類について指示が来ます。持ち込めないものがあれば正直に対応しましょう。`,
    roles: [
      { emoji: "👮", name: "Kontrolleur/in", sub: "担当者役 ─ 全文読む" },
      { emoji: "🧳", name: "Passagier/in",   sub: "乗客役 ─ キーワードを見て考える" }
    ],
    dialogue: [
      {
        staff: { de: "Bitte legen Sie alles Metall in die Schale. Gürtel, Schlüssel, Kleingeld.", jp: "金属類はすべてトレーに。ベルト、鍵、小銭。" },
        pass:  { task: "わかりました、と答えてから靴も脱ぐ必要があるか聞く", keywords: ["Alles klar", "Schuhe ausziehen?"], de: "Alles klar. Muss ich auch die Schuhe ausziehen?", jp: "わかりました。靴も脱がないといけませんか？" }
      },
      {
        staff: { de: "Ja, bitte. Und nehmen Sie Ihren Laptop aus der Tasche.", jp: "はい、お願いします。ノートPCもカバンから出してください。" },
        pass:  { task: "水のボトルを持っているが、持ち込んでいいか聞く", keywords: ["Flasche Wasser", "Darf ich ... behalten?"], de: "Oh, ich habe auch eine Flasche Wasser. Darf ich die behalten?", jp: "あ、水のボトルもあります。持ってていいですか？" }
      },
      {
        staff: { de: "Leider nein. Flüssigkeiten über 100 ml sind nicht erlaubt.", jp: "残念ながら、100ml超の液体は持ち込めません。" },
        pass:  { task: "わかった、捨てます。これで全部です、と伝える", keywords: ["Verstanden", "entsorgen", "alles"], de: "Verstanden. Ich entsorge sie. Hier ist alles.", jp: "わかりました。捨てます。これで全部です。" }
      },
      {
        staff: { de: "Danke. Bitte gehen Sie durch die Schleuse.", jp: "ありがとうございます。ゲートをくぐってください。" },
        pass:  { task: "ピーっと鳴った。コインがまだあるかも、と言う", keywords: ["piepsen?", "Münzen"], de: "Hat es gepiept? Ich habe vielleicht noch Münzen.", jp: "鳴りましたか？まだコインがあるかもしれません。" }
      },
      {
        staff: { de: "Kein Problem. Leeren Sie bitte nochmals Ihre Taschen.", jp: "問題ありません。もう一度ポケットを空にしてください。" },
        pass:  { task: "コインが出てきた。謝って、もう大丈夫なはず、と言う", keywords: ["sorry", "Münzen", "klappen"], de: "Sorry — hier sind die Münzen. Jetzt sollte es klappen!", jp: "すみません——ここにありました。これで大丈夫なはずです！" }
      }
    ],
    phrases: [
      { de: "Muss ich ... ausziehen?", jp: "〜を脱がないといけませんか？" },
      { de: "Darf ich ... behalten?", jp: "〜は持ち込んでいいですか？" },
      { de: "Flüssigkeiten über 100 ml sind nicht erlaubt.", jp: "100ml超の液体は禁止です。" },
      { de: "Ich entsorge es.", jp: "捨てます。" },
      { de: "Jetzt sollte es klappen!", jp: "これで大丈夫なはずです！" },
      { de: "Leeren Sie Ihre Taschen.", jp: "ポケットを空にしてください。" },
    ]
  },
  {
    id: "gate",
    tab: "③ 遅延・ゲート確認",
    location: "🚪 Gate B7 · 搭乗口（遅延発生中）",
    mission: `ゲートでアナウンスを聞きました。<strong>LH714便が45分遅延</strong>しています。ゲート係員に原因・新しい出発時刻・ゲート変更の有無を確認しましょう。`,
    roles: [
      { emoji: "🧑‍✈️", name: "Gate-Personal", sub: "担当者役 ─ 全文読む" },
      { emoji: "😟", name: "Passagier/in",  sub: "乗客役 ─ キーワードを見て考える" }
    ],

let currentScenario = 0;
let rolesSwapped = false;

function renderTabs() {
  document.getElementById('scenarioTabs').innerHTML = scenarios.map((s, i) =>
    `<button class="tab ${i === currentScenario ? 'active' : ''}" onclick="switchScenario(${i})">${s.tab}</button>`
  ).join('');
}

function switchScenario(idx) {
  currentScenario = idx;
  rolesSwapped = false;
  renderTabs();
  renderCard(false);
}

function renderCard(animate) {
  const s = scenarios[currentScenario];
  const area = document.getElementById('cardArea');
  if (animate) {
    area.classList.add('switching');
    setTimeout(() => area.classList.remove('switching'), 300);
  }

  const roles = rolesSwapped ? [s.roles[1], s.roles[0]] : s.roles;

  document.getElementById('missionBox').innerHTML = `
    <div class="mission-label">📍 Situation</div>
    <div class="mission-text">${s.location}<br><br>${s.mission}</div>
  `;

  document.getElementById('cardHeader').innerHTML = roles.map(r => `
    <div class="role-header">
      <span class="role-emoji">${r.emoji}</span>
      <div>
        <div class="role-name">${r.name}</div>
        <div class="role-sub">${r.sub}</div>
      </div>
    </div>
  `).join('');

  // Dialogue turns
  let html = '';
  s.dialogue.forEach((turn, i) => {
    // Determine which side is staff and which is passenger
    // If roles are swapped, swap the rendering too
    const staffCell = renderStaffCell(turn.staff, i);
    const passCell  = renderPassCell(turn.pass, i);

    if (rolesSwapped) {
      html += `<div class="turn">${passCell}${staffCell}</div>`;
    } else {
      html += `<div class="turn">${staffCell}${passCell}</div>`;
    }
  });
  document.getElementById('dialogueBody').innerHTML = html;

  // Phrases
  document.getElementById('phrasesGrid').innerHTML = s.phrases.map(p => `
    <div class="phrase-chip">
      <div class="phrase-de">${p.de}</div>
      <div class="phrase-jp">${p.jp}</div>
    </div>
  `).join('');
}

function renderStaffCell(line, idx) {
  if (!line) return `<div class="turn-cell"><span class="turn-blank">—</span></div>`;
  return `
    <div class="turn-cell">
      <span class="turn-num">${idx + 1}</span>
      <div class="staff-de">${line.de}</div>
      <div class="staff-jp">${line.jp}</div>
    </div>`;
}

function renderPassCell(line, idx) {
  if (!line) return `<div class="turn-cell"><span class="turn-blank">—</span></div>`;
  const kwHtml = line.keywords.map(k => `<span class="kw">${k}</span>`).join('');
  return `
    <div class="turn-cell">
      <span class="turn-num">${idx + 1}</span>
      <div class="pass-task">💬 ${line.task}</div>
      <div class="keywords">${kwHtml}</div>
      <button class="reveal-btn" id="rbtn-${idx}" onclick="toggleReveal(${idx})">
        <span class="icon">▶</span> 正解例を見る
      </button>
      <div class="full-sentence" id="full-${idx}">
        <div class="full-label">正解例 Musterlösung</div>
        <div class="full-de">${line.de}</div>
        <div class="full-jp">${line.jp}</div>
      </div>
    </div>`;
}

function toggleReveal(idx) {
  const el  = document.getElementById(`full-${idx}`);
  const btn = document.getElementById(`rbtn-${idx}`);
  const open = el.classList.toggle('visible');
  btn.classList.toggle('open', open);
  btn.innerHTML = open
    ? `<span class="icon">▶</span> 閉じる`
    : `<span class="icon">▶</span> 正解例を見る`;
}

function revealAll() {
  const s = scenarios[currentScenario];
  s.dialogue.forEach((_, i) => {
    const el  = document.getElementById(`full-${i}`);
    const btn = document.getElementById(`rbtn-${i}`);
    if (el && !el.classList.contains('visible')) {
      el.classList.add('visible');
      if (btn) {
        btn.classList.add('open');
        btn.innerHTML = `<span class="icon">▶</span> 閉じる`;
      }
    }
  });
}

function shuffleRoles() {
  rolesSwapped = !rolesSwapped;
  renderCard(true);
}

function nextScenario() {
  currentScenario = (currentScenario + 1) % scenarios.length;
  rolesSwapped = false;
  renderTabs();
  renderCard(true);
}

renderTabs();
renderCard(false);
</script>
