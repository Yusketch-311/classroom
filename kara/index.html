<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カラオケ思い出しガチャ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14101f;--panel:#1f1830;--panel2:#2a2140;--text:#f3eefc;--muted:#a99cc4;--accent:#ff4f9a;--accent2:#ffd23f;--ok:#3ddc97;--line:#3a2f55}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0%,#2b1747 0,var(--bg) 55%);color:var(--text);font-family:"Noto Sans JP",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;font-weight:900;margin:4px 0 2px;letter-spacing:.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label.lbl{font-size:13px;color:var(--muted);margin-right:4px}
input[type=number]{width:96px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--accent2);color:#1a1300;background:var(--accent2);font-weight:700}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.card{background:linear-gradient(160deg,#3a1d5c,#22183a);border:1px solid #5a3f86;border-radius:18px;padding:26px 20px 20px;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center}
.card .tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--accent2);margin:0 auto 10px}
.card .title{font-size:28px;font-weight:900;line-height:1.3;word-break:break-word}
.card .artist{font-size:16px;color:#d9cdf0;margin-top:6px}
.card .meta{font-size:13px;color:var(--muted);margin-top:10px}
.card .hint{font-size:12.5px;color:#c7b8e6;margin-top:14px;border-top:1px dashed #5a3f86;padding-top:10px}
.prompt{font-size:22px;font-weight:700;line-height:1.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{padding:13px 6px;border-radius:12px;border:none;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:#fff;background:var(--panel2)}
.btn.ok{background:var(--ok);color:#06281a}
.btn.big{background:var(--accent);font-size:17px;padding:16px;width:100%;margin-top:12px}
.btn.small{padding:6px 10px;font-size:12px;border-radius:8px}
.stat{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-size:15px}
.list .t small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.note{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.6}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>カラオケ<span>思い出し</span>ガチャ</h1>
  <p class="sub">「ああ、これあった！」を引き当てて、歌える曲リストを育てよう。</p>

  <div class="tabs">
    <button class="tab on" data-tab="gacha">曲ガチャ</button>
    <button class="tab" data-tab="all">曲一覧</button>
    <button class="tab" data-tab="list">歌えるリスト <span id="cnt"></span></button>
  </div>

  <!-- ガチャ -->
  <section id="tab-gacha">
    <div class="box">
      <div class="row">
        <label class="lbl" for="by">生まれ年</label>
        <input id="by" type="number" min="1940" max="2020" placeholder="例 1990">
        <span class="lbl" id="byNote">→ 6〜30歳ごろの年代を自動で選びます</span>
      </div>
      <div class="chips" id="typeChips"></div>
      <details style="margin-top:10px">
        <summary>年代・ジャンルを細かく選ぶ</summary>
        <div class="chips" id="eraChips"></div>
        <div class="chips" id="catChips"></div>
      </details>
    </div>

    <div class="card" id="card">
      <div class="prompt" style="color:var(--muted);font-size:16px">下のボタンでガチャを回してください</div>
    </div>
    <div class="btns" id="judge" style="visibility:hidden">
      <button class="btn ok" data-j="sing">歌える！</button>
      <button class="btn" data-j="fav" style="background:var(--accent2);color:#1a1300">気になる<br><small>（あとで聴く）</small></button>
      <button class="btn" data-j="know">知ってるけど<br>微妙</button>
      <button class="btn" data-j="no">知らない<br><small>（パス）</small></button>
    </div>
    <button class="btn big" id="spin">ガチャを回す 🎤</button>
    <div class="stat" id="stat"></div>
  </section>

  <!-- 一覧 -->
  <section id="tab-all" class="hidden">
    <div class="box">
      <div class="chips" id="allCats" style="margin-top:0"></div>
      <p class="stat" style="text-align:left;margin:10px 0 0">年代順に並んでいます。💎は隠れた名曲。気になった曲は「＋」でリストへ。</p>
      <ul class="list" id="allList"></ul>
    </div>
  </section>

  <!-- リスト -->
  <section id="tab-list" class="hidden">
    <div class="box">
      <div class="row" style="justify-content:space-between">
        <b>歌える曲 ＆ 気になる曲</b>
        <button class="btn small" id="copyAll">全部コピー</button>
      </div>
      <ul class="list" id="list"></ul>
      <div class="row" style="margin-top:12px">
        <input id="freeTitle" placeholder="自分で思い出した曲名を追加" style="flex:1;min-width:140px;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit">
        <button class="btn ok small" id="addFree" style="padding:10px 14px">追加</button>
      </div>
    </div>
    <p class="stat">次にカラオケするとき、ここから選べば迷いません。</p>
  </section>

  <p class="note">※ 曲の年はヒットした時期の目安です。JOYSOUNDに配信があるかは曲検索で確認してください。リストはこのブラウザだけに保存されます。</p>
</div>
<div class="toast" id="toast"></div>

const ERAS=[
 {k:'~79',label:'〜1979',from:0,to:1979},
 {k:'80s',label:'80年代',from:1980,to:1989},
 {k:'90a',label:'1990〜94',from:1990,to:1994},
 {k:'90b',label:'1995〜99',from:1995,to:1999},
 {k:'00a',label:'2000〜04',from:2000,to:2004},
 {k:'00b',label:'2005〜09',from:2005,to:2009},
 {k:'10a',label:'2010〜14',from:2010,to:2014},
 {k:'10b',label:'2015〜19',from:2015,to:2019},
 {k:'20s',label:'2020〜',from:2020,to:2100},
];
const CATS=[{k:'pop',label:'J-POP・歌謡'},{k:'anime',label:'アニメ'},{k:'vocalo',label:'ボカロ'},{k:'vkei',label:'ヴィジュアル系'},{k:'kpop',label:'K-POP'}];
const CATLABEL={pop:'J-POP・歌謡',anime:'アニメ',vocalo:'ボカロ',vkei:'ヴィジュアル系',kpop:'K-POP'};

const HINTS=['知らなかったら「気になる」に入れて、あとで聴いてみよう','同じ歌手の別の曲も思い出してみて','この年にほかに流行ってた曲は？','この曲がかかってた場面を思い出してみて','似た雰囲気の曲で歌えるものは？'];

const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('kgacha_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('kgacha_'+k,JSON.stringify(v))}catch(e){}}};

let birth=store.get('birth',null);
let eraOn=new Set(store.get('eras',ERAS.map(e=>e.k)));
let catOn=new Set(store.get('cats2',CATS.map(c=>c.k)));
let typeOn=new Set(store.get('types',['hidden']));
const TYPES=[{k:'hidden',label:'💎 隠れた名曲'},{k:'std',label:'📼 なつかしヒット'}];
let judged=store.get('judged2',{}); // id -> sing/know/no
let saved=store.get('saved',[]); // {t,a,y,c}
let current=null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1400)}
function eraOf(y){return ERAS.find(e=>y>=e.from&&y<=e.to)}

function autoEras(){
  if(!birth)return;
  const lo=birth+6,hi=birth+30;
  eraOn=new Set(ERAS.filter(e=>e.to>=lo&&e.from<=hi).map(e=>e.k));
  if(!eraOn.size)eraOn=new Set(ERAS.map(e=>e.k));
  store.set('eras',[...eraOn]);
}
function renderChips(){
  $('#eraChips').innerHTML=ERAS.map(e=>`<button class="chip ${eraOn.has(e.k)?'on':''}" data-era="${e.k}">${e.label}</button>`).join('');
  $('#typeChips').innerHTML=TYPES.map(t=>`<button class="chip ${typeOn.has(t.k)?'on':''}" data-type="${t.k}">${t.label}</button>`).join('');
  $('#catChips').innerHTML=CATS.map(c=>`<button class="chip ${catOn.has(c.k)?'on':''}" data-cat="${c.k}">${c.label}</button>`).join('');
}
function pool(){
  return RAW.filter(s=>catOn.has(s.c)&&typeOn.has(s.h?'hidden':'std')&&(s.y===0||eraOn.has(eraOf(s.y).k))&&!judged[s.id]);
}
function updateStat(){
  const p=pool().length;
  $('#stat').textContent=`残り ${p} 曲`+(Object.keys(judged).length?` ・ 判定済み ${Object.keys(judged).length} 曲`:'')+(p===0?'（年代やジャンルを広げてください）':'');
  $('#cnt').textContent=saved.length?`(${saved.length})`:'';
}
function spin(){
  const p=pool();
  if(!p.length){
    $('#card').innerHTML=`<div class="prompt" style="font-size:16px">この条件の曲は全部見ました！<br><br><button class="btn small" id="reset">判定をリセット</button></div>`;
    $('#judge').style.visibility='hidden';
    $('#reset').onclick=()=>{judged={};store.set('judged2',judged);spin()};
    return;
  }
  current=p[Math.floor(Math.random()*p.length)];
  const age=birth&&current.y?current.y-birth:null;
  const meta=`${current.y}年ごろ`+(age!==null&&age>=0?` ・ あなたが${age}歳のころ`:'');
  const hint=current.c==='kpop'?'🇰🇷 JOYSOUNDでは韓国語版（カタカナルビ付き）を選んでね':HINTS[Math.floor(Math.random()*HINTS.length)];
  $('#card').innerHTML=`<span class="tag">${CATLABEL[current.c]}${current.h?' ・ 💎隠れた名曲':''}</span>
    <div class="title"></div><div class="artist"></div>
    <div class="meta">${meta}</div>
    <div class="hint">💭 ${hint}</div>`;
  $('#card .title').textContent=current.t;
  $('#card .artist').textContent=current.a;
  $('#judge').style.visibility='visible';
  updateStat();
}
function addSaved(item){
  const ex=saved.find(s=>s.t===item.t&&s.a===item.a);
  if(ex&&ex.fav&&!item.fav){ex.fav=false;store.set('saved',saved);renderList();toast('歌えるに変更しました');return}
  if(saved.some(s=>s.t===item.t&&s.a===item.a)){toast('もうリストにあります');return}
  saved.unshift(item);store.set('saved',saved);renderList();updateStat();toast(item.fav?'「気になる」に追加しました':'リストに追加しました');
}
function renderList(){
  const ul=$('#list');
  if(!saved.length){ul.innerHTML='<li class="empty" style="display:block">まだありません。ガチャで「歌える！」「気になる」を押すとここに貯まります。</li>';return}
  ul.innerHTML='';
  saved.forEach((s,i)=>{
    const li=document.createElement('li');
    li.innerHTML=`<div class="t"><b></b><small></small></div><button class="btn small" data-copy="${i}">コピー</button><button class="btn small" data-del="${i}">✕</button>`;
    li.querySelector('b').textContent=s.t;
    li.querySelector('small').textContent=(s.fav?'☆気になる ・ ':'')+(s.a||'')+(s.y?` ・ ${s.y}年ごろ`:'');
    ul.appendChild(li);
  });
}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('コピーしました')}catch(e){toast('コピーできませんでした')}}

// events
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  ['gacha','all','list'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==b.dataset.tab));
});
$('#by').oninput=e=>{
  const v=+e.target.value;
  if(v>=1940&&v<=2020){birth=v;store.set('birth',v);autoEras();renderChips();updateStat();
    $('#byNote').textContent=`→ ${ERAS.filter(x=>eraOn.has(x.k)).map(x=>x.label).join('・')}`;}
};
$('#eraChips').onclick=e=>{const k=e.target.dataset.era;if(!k)return;eraOn.has(k)?eraOn.delete(k):eraOn.add(k);store.set('eras',[...eraOn]);renderChips();updateStat()};
$('#typeChips').onclick=e=>{const k=e.target.dataset.type;if(!k)return;typeOn.has(k)?typeOn.delete(k):typeOn.add(k);store.set('types',[...typeOn]);renderChips();updateStat()};
$('#catChips').onclick=e=>{const k=e.target.dataset.cat;if(!k)return;catOn.has(k)?catOn.delete(k):catOn.add(k);store.set('cats2',[...catOn]);renderChips();updateStat()};
$('#spin').onclick=spin;
$('#judge').onclick=e=>{
  const j=e.target.closest('[data-j]');if(!j||!current)return;
  judged[current.id]=j.dataset.j;store.set('judged2',judged);
  if(j.dataset.j==='sing')addSaved({t:current.t,a:current.a,y:current.y,c:current.c});
  if(j.dataset.j==='fav')addSaved({t:current.t,a:current.a,y:current.y,c:current.c,fav:true});
  spin();
};
$('#addFree').onclick=()=>{const v=$('#freeTitle').value.trim();if(!v)return;addSaved({t:v,a:'',y:0,c:'free'});$('#freeTitle').value=''};
$('#list').onclick=e=>{
  if(e.target.dataset.copy!==undefined)copy(saved[+e.target.dataset.copy].t);
  if(e.target.dataset.del!==undefined){saved.splice(+e.target.dataset.del,1);store.set('saved',saved);renderList();updateStat()}
};
$('#copyAll').onclick=()=>copy(saved.map(s=>s.a?`${s.t} / ${s.a}`:s.t).join('\n'));

let allCat='vocalo';
function renderAll(){
  $('#allCats').innerHTML=CATS.map(c=>`<button class="chip ${allCat===c.k?'on':''}" data-allcat="${c.k}">${c.label}（${RAW.filter(s=>s.c===c.k).length}）</button>`).join('');
  const items=RAW.filter(s=>s.c===allCat).sort((a,b)=>a.y-b.y);
  const ul=$('#allList');ul.innerHTML='';let lastEra='';
  items.forEach(s=>{
    const er=eraOf(s.y).label;
    if(er!==lastEra){const h=document.createElement('li');h.innerHTML=`<b style="color:var(--accent2);font-size:13px">${er}</b>`;ul.appendChild(h);lastEra=er}
    const li=document.createElement('li');
    li.innerHTML=`<div class="t"><b></b><small></small></div><button class="btn small" data-add="${RAW.indexOf(s)}">＋</button>`;
    li.querySelector('b').textContent=(s.h?'💎 ':'')+s.t;li.querySelector('small').textContent=`${s.a} ・ ${s.y}年ごろ`;
    ul.appendChild(li);
  });
}
$('#allCats').onclick=e=>{const k=e.target.dataset.allcat;if(!k)return;allCat=k;renderAll()};
$('#allList').onclick=e=>{const i=e.target.dataset.add;if(i===undefined)return;const s=RAW[+i];addSaved({t:s.t,a:s.a,y:s.y,c:s.c})};

// init
renderAll();
if(birth){$('#by').value=birth;$('#byNote').textContent=`→ ${ERAS.filter(x=>eraOn.has(x.k)).map(x=>x.label).join('・')}`}
renderChips();renderList();updateStat();
</script>
</body>
</html>
